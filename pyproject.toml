[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sourcehub"
version = "0.1.0"
description = "REST API and Snowflake ingestion into Microsoft Fabric bronze: pagination, rate limits, retries, late-arriving data"
requires-python = ">=3.10"
authors = [{ name = "Lucas Wall" }]
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
snowflake = ["snowflake-connector-python>=3.6"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
